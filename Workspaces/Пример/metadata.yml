  summary: "Исследуются квадратичный и линейный показатели и их сумма. Из единой модели на R формируются текстовые результаты, таблицы с математическими подстановками, графики и расширенный расчёт. Приведены программные проверки согласованности, исходный код и воспроизводимые файлы результатов."
