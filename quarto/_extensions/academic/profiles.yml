# Shared sheet composition. academic.standard selects STO 04 or 21 for coursework,
# STO 17 for referat; standard-specific page furniture is applied by the C# service.
profiles:
  coursework:
    label: "Курсовая работа"
    before-body: [title, assignment, annotation]
    required:
      - academic.document-code
      - academic.normal-controller.name
      - academic.normal-controller.position
  referat:
    label: "Реферат"
    before-body: [title, annotation]
sheets:
  title:
    label: "Титульный лист"
    required:
      - title
      - author
      - academic.university
      - academic.parent-organization
      - academic.university-short
      - academic.school
      - academic.department
      - academic.discipline
      - academic.group
      - academic.supervisor
      - academic.supervisor-position
      - academic.author-short
      - academic.city
      - academic.year
  assignment:
    label: "Задание"
    required:
      - academic.direction-code
      - academic.direction
      - academic.assignment.head-of-department
      - academic.assignment.approval-date
      - academic.assignment.due-date
  annotation:
    label: "Аннотация"
    required: [academic.summary]
